# One command runs MakeCents and MongoDB:  docker compose up --build
# Needs SESSION_SECRET (and ANTHROPIC_API_KEY for chat and receipt reading) in .env next to this file.
# Demo data:  docker compose run --rm app node scripts/seed-transactions.js
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped # retries until MongoDB is ready
    depends_on:
      - mongo
    ports:
      - '8080:8080'
    environment:
      MONGODB_URI: mongodb://mongo:27017/finance_assistant
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}

volumes:
  mongo-data:
